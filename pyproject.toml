[project]
name = "tieout"
version = "0.1.0"
description = "Reconciliation engine that ties out a position book against a market feed using Redis Streams, trade by trade."
readme = "README.md"
authors = [
    { name = "Owen Hochwald", email = "62612083+owenHochwald@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
